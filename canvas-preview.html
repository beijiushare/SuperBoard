<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Canvas Preview</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .preview-controls {
        position: fixed;
        z-index: 10;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 8px;
        padding: 8px;
        border: 1px solid #dedbd2;
        border-radius: 10px;
        background: #fffdf8;
        box-shadow: 0 8px 24px rgb(20 18 10 / 12%);
      }

      .preview-controls button {
        padding: 7px 10px;
        border: 1px solid #dedbd2;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/src/canvas-preview/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 800 364" width="800" height="364" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><style>svg.pele{--pele-bg:#ffffff;--pele-fg:#2e3338;--pele-fg-on-light:#2e3338;--pele-fg-on-dark:#fff;--pele-muted:#888888;--pele-line:#2e3338;--pele-surface:#f6f6f6;--pele-surface-alt:#f0f0f0;--pele-border:#e0e0e0;--pele-accent:#8a5cf5;--pele-critical:#e93147;--pele-error:#e93147;--pele-radius:6px;--pele-font:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;--pele-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--pele-series-1:#086ddd;--pele-series-2:#ec7500;--pele-series-3:#08b94e;--pele-series-4:#e93147;--pele-series-5:#00bfbc;--pele-series-6:#e0ac00;--pele-series-7:#7852ee;--pele-series-8:#d53984}</style><path class="pele-axis" d="M8,116H785" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M792,116L784,119.36L784,112.64Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Stone Age"><rect x="8" y="8" width="372" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="194" y="33.6">Stone Age</tspan></text><g class="pele-node pele-period" data-id="7600 BC"><rect x="8" y="56" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="96" y="81.6" text-anchor="middle">7600 BC</text><path class="pele-edge" d="M96,96V136" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="96" cy="116" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="8" y="136" width="176" height="70" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="96" y="157.9">Britain's oldest known</tspan><tspan x="96" y="175.9">house was built in</tspan><tspan x="96" y="193.9">Orkney, Scotland</tspan></text></g></g><g class="pele-node pele-period" data-id="6000 BC"><rect x="204" y="56" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="292" y="81.6" text-anchor="middle">6000 BC</text><path class="pele-edge" d="M292,96V136" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="292" cy="116" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="204" y="136" width="176" height="124" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="292" y="157.9">Sea levels rise and</tspan><tspan x="292" y="175.9">Britain becomes an</tspan><tspan x="292" y="193.9">island.</tspan><tspan x="292" y="211.9">The people who live</tspan><tspan x="292" y="229.9">here are</tspan><tspan x="292" y="247.9">hunter-gatherers.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Bronze Age"><rect x="400" y="8" width="372" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="586" y="33.6">Bronze Age</tspan></text><g class="pele-node pele-period" data-id="2300 BC"><rect x="400" y="56" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="488" y="81.6" text-anchor="middle">2300 BC</text><path class="pele-edge" d="M488,96V136M488,242V250" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="488" cy="116" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="400" y="136" width="176" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="157.9">People arrive from</tspan><tspan x="488" y="175.9">Europe and settle in</tspan><tspan x="488" y="193.9">Britain.</tspan><tspan x="488" y="211.9">They bring farming and</tspan><tspan x="488" y="229.9">metalworking.</tspan></text></g><g class="pele-node pele-event"><rect x="400" y="250" width="176" height="70" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="271.9">New styles of pottery</tspan><tspan x="488" y="289.9">and ways of burying the</tspan><tspan x="488" y="307.9">dead appear.</tspan></text></g></g><g class="pele-node pele-period" data-id="2200 BC"><rect x="596" y="56" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="684" y="81.6" text-anchor="middle">2200 BC</text><path class="pele-edge" d="M684,96V136M684,242V250" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="684" cy="116" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="596" y="136" width="176" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="157.9">The last major building</tspan><tspan x="684" y="175.9">works are completed at</tspan><tspan x="684" y="193.9">Stonehenge.</tspan><tspan x="684" y="211.9">People now bury their</tspan><tspan x="684" y="229.9">dead in stone circles.</tspan></text></g><g class="pele-node pele-event"><rect x="596" y="250" width="176" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="271.9">The first metal objects</tspan><tspan x="684" y="289.9">are made in</tspan><tspan x="684" y="307.9">Britain.Some other nice</tspan><tspan x="684" y="325.9">things happen. it is a</tspan><tspan x="684" y="343.9">good time to be alive.</tspan></text></g></g></g></svg>